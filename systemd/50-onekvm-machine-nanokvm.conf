[Unit]
Requires=onekvm-machine-nanokvm-detect.service
# A capture chip failure leaves video unavailable; Web, SSH and the screen stay up.
Wants=onekvm-capture-chip-init.service onekvm-video-soph-mmf-modules.service onekvm-device-gpio-atx.service
After=onekvm-machine-nanokvm-detect.service onekvm-video-soph-mmf-modules.service onekvm-capture-chip-init.service

[Service]
# Sophgo CVI_SYS opens /dev/mem during MMF initialization. Keep this raw-I/O
# capability limited to NanoKVM; AX video backends do not need it.
CapabilityBoundingSet=CAP_SYS_RAWIO
