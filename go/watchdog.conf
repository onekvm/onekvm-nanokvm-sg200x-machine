[Unit]
# NFS boot needs the same hardware recovery as SD boot.
ConditionKernelCommandLine=
# Dependencies cannot be cleared in a drop-in; the base After=onekvm.service
# lives in 10-after-onekvm.conf, which Go overrides in /etc (watchdog-order.conf).
Before=onekvm.service

[Service]
ExecStartPre=/usr/libexec/onekvm/go-watchdog-handoff
ExecStart=
ExecStart=/usr/libexec/onekvm/onekvm-watchdog --startup-timeout-sec 180 --hardware-reset --no-dump
# Reopening on failure would feed the timer that is supposed to reset Go.
Restart=no
